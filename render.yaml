services:
  # Backend FastAPI Microservice
  - type: web
    name: heritageflow-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.backend
    plan: free
    healthCheckPath: /health

  # Frontend Streamlit Microservice
  - type: web
    name: heritageflow-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile.frontend
    plan: free
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: heritageflow-backend
          property: host
