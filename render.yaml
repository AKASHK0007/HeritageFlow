services:
  - type: web
    name: heritageflow-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile.backend
    region: oregon
    plan: free
    healthCheckPath: /health

  - type: web
    name: heritageflow-frontend
    env: docker
    rootDir: frontend
    dockerfilePath: Dockerfile.frontend
    region: oregon
    plan: free
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: heritageflow-backend
          property: host
